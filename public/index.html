<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suds Construction Monitoring</title>
<meta name="theme-color" content="#FF6B00">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  /* ====== ONLY SETTING YOU NEED TO CHANGE ======
     Paste your Apps Script Web app URL (ends with /exec) between the quotes. */
  window.SUDS_API_URL = 'https://script.google.com/macros/s/AKfycbyGpqA2coGoryu8DoLvPGXEyg91Sd4aTB8_D4eUjFMw1L17yIk3-IPBcw3u9O2xrkI/exec';
</script>
<style>
:root{
  --orange:#FF6B00;--orange-deep:#D95600;--orange-soft:#FFF0E3;--orange-line:#FFD2AD;
  --ink:#2B2B2B;--muted:#7A7A7A;--line:#ECECEC;--bg:#FAFAF8;--card:#fff;
  --green:#1E9E5A;--green-soft:#E6F6ED;--amber:#C77700;--amber-soft:#FFF4DC;--red:#D93B3B;--red-soft:#FDECEC;
  --blue:#2C6ECB;--blue-soft:#E8F0FB;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
a{color:var(--orange-deep)}
.hidden{display:none!important}
header{background:var(--orange);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header .t{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who{font-size:13px;opacity:.95;text-align:right}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
.banner{background:var(--amber-soft);color:var(--amber);padding:8px 18px;font-size:13px;display:flex;gap:10px;align-items:center}
main{max-width:1180px;margin:0 auto;padding:18px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:17px;margin:20px 0 10px}h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}.nowrap{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.warn .v{color:var(--red)}
.btn{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--orange-deep)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sec:hover{background:#f4f4f2}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.sm{padding:5px 10px;font-size:13px;font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;background:#FBFBF9}
tr.click{cursor:pointer}tr.click:hover td{background:var(--orange-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tw table{border:0}.tw tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#EEE;color:#555;white-space:nowrap}
.b-green{background:var(--green-soft);color:var(--green)}.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-red{background:var(--red-soft);color:var(--red)}.b-blue{background:var(--blue-soft);color:var(--blue)}.b-orange{background:var(--orange-soft);color:var(--orange-deep)}
.bar{height:8px;background:#EEE;border-radius:9px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--orange)}
.bar.green>i{background:var(--green)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 16px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--orange-deep);border-color:var(--orange)}
.tab .cnt{background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],input[type=url],select,textarea{
  width:100%;padding:9px 10px;border:1px solid #D9D9D6;border-radius:8px;background:#fff}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange-line);border-color:var(--orange)}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:14px;margin:6px 0}
.chk input{margin-top:3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:640px){.f2{grid-template-columns:1fr}main{padding:12px}}
.back{background:none;border:0;color:var(--orange-deep);cursor:pointer;padding:0;font-weight:600;margin-bottom:6px}
.steps{display:flex;gap:0;margin:8px 0 16px;overflow-x:auto}
.step{flex:1;min-width:90px;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:18px}
.step:before{content:"";position:absolute;top:6px;left:0;right:0;height:3px;background:#E5E5E2}
.step:after{content:"";position:absolute;top:1px;left:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:#E5E5E2}
.step.done{color:var(--ink)}.step.done:before,.step.done:after{background:var(--orange)}
.step.cur{color:var(--orange-deep);font-weight:700}.step.cur:after{background:#fff;border:3px solid var(--orange);top:-1px;width:16px;height:16px;left:calc(50% - 8px)}
.media{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.media a{display:block;width:96px;height:96px;border-radius:8px;overflow:hidden;background:#EEE;border:1px solid var(--line);position:relative;text-decoration:none}
.media img{width:100%;height:100%;object-fit:cover}
.media .doc{display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;padding:6px;text-align:center;color:var(--ink);word-break:break-all}
.media .vid:before{content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--orange)}
.feed .item{border-left:3px solid var(--orange-line);padding:4px 0 4px 14px;margin-bottom:18px}
.pill{display:inline-flex;gap:4px;align-items:center;background:var(--orange-soft);color:var(--orange-deep);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.empty{padding:26px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #DDD;border-radius:12px}
.warnbox{background:var(--red-soft);color:var(--red);padding:9px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.infobox{background:var(--blue-soft);color:var(--blue);padding:9px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.okbox{background:var(--green-soft);color:var(--green);padding:9px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.login{max-width:420px;margin:30px auto}
.lines input{padding:6px 7px}
.lines td{padding:5px 4px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:30px 12px}
#modal .box{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
#modal .box.wide{max-width:900px}
#modal .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;font-weight:700;font-size:16px}
#modal .bd{padding:6px 18px 16px}
#modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#modal .x{margin-left:auto;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
#busy{position:fixed;inset:0;background:rgba(43,43,43,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
#busy .bbox{background:#fff;border-radius:14px;padding:22px 24px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center}
#busy .bhead{display:flex;align-items:center;gap:12px;justify-content:center;font-weight:700}
#busy .bsub{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px}
#busy .pbar{height:10px;background:var(--orange-soft);border-radius:9px;overflow:hidden;margin:14px 0 6px}
#busy .pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),#FF9A4D);border-radius:9px;transition:width .2s ease}
#busy .bpct{font-size:22px;font-weight:800;color:var(--orange-deep);font-variant-numeric:tabular-nums}
#busy.ok .spin{border-color:var(--green);animation:none}
#busy.ok .pbar>i{background:var(--green)}#busy.ok .bpct{color:var(--green)}
.spin{width:22px;height:22px;flex-shrink:0;border:4px solid var(--orange-line);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2B2B2B;color:#fff;padding:10px 16px;border-radius:10px;z-index:70;max-width:90%;font-size:14px}
#toast.err{background:var(--red)}
.filelist{font-size:13px;color:var(--muted);margin-top:4px}
.copy{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#F4F4F2;padding:3px 6px;border-radius:5px;word-break:break-all}
</style>
</head>
<body>
<header>
  <div class="t" id="hdTitle">Suds Construction Monitoring</div>
  <span id="hdSync" class="hidden small" style="opacity:.9">⟳ Updating…</span>
  <div class="who" id="hdWho"></div>
  <button id="hdOut" class="hidden" onclick="logout()">Log out</button>
</header>
<div id="asBanner" class="banner hidden"></div>
<main id="app"><div class="empty">Loading…</div></main>
<div id="modal" class="hidden"></div>
<div id="busy" class="hidden"><div class="bbox"><div class="bhead"><div class="spin"></div><span id="busyMsg">Please wait…</span></div>
  <div class="bsub" id="busySub"></div><div class="pbar"><i id="busyBar"></i></div><div class="bpct" id="busyPct">0%</div></div></div>
<div id="toast" class="hidden"></div>

<script>
/* ═════════════════ Basics ═════════════════ */
const S = { token:null, me:null, d:null, view:{name:'home'}, tab:{}, adminToken:null };
const $ = id => document.getElementById(id);
const h = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => h(s).replace(/\n/g,'<br>');
const num = v => { const n = Number(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; };
const peso = n => '₱' + num(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = n => Math.round(num(n)) + '%';
const truthy = v => v===true || String(v).toUpperCase()==='TRUE';
const fmtD = s => { if(!s) return '—'; const d=new Date(String(s).slice(0,10)+'T00:00:00'); return isNaN(d)?h(s):d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}); };
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}} };

/* Every save asks the server to send the refreshed data back in the same answer (one trip instead of two).
   The last data is also kept on this device, so the app shows it instantly next time and updates in the background. */
const NO_TOKEN = /^api_(adminLogin|ownerLogin|supplierLogin|supplierRegister|supplierResetPin)$/;
S.ready = Promise.resolve(); S.fresh = null;
function api(fn, ...args){
  const url = window.SUDS_API_URL;
  if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(url||'')) return Promise.reject(new Error('App link not set up yet (SUDS_API_URL in index.html).'));
  const withData = !/^api_(upload|data$|inviteViewed)/.test(fn);
  return (NO_TOKEN.test(fn) ? Promise.resolve() : S.ready).then(()=>{
    if(!NO_TOKEN.test(fn)) args[0] = S.token;
    const ctl = new AbortController(), tm = setTimeout(()=>ctl.abort(), /^api_upload/.test(fn) ? 180000 : 120000);
    return fetch(url,{method:'POST',redirect:'follow',signal:ctl.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args,withData})})
      .finally(()=>clearTimeout(tm))
      .catch(e=>{ throw new Error(e.name==='AbortError' ? 'The connection timed out.' : 'Network problem – please check your internet.'); });
  })
    .then(r=>{ if(!r.ok) throw new Error('Network error ('+r.status+')'); return r.json().catch(()=>{ throw new Error('Google is busy – please try again.'); }); })
    .then(r=>{ if(!r.ok){ if(r.error==='SESSION_EXPIRED'){ sessionExpired(); } const e=new Error(r.error==='SESSION_EXPIRED'?'Your session expired. Please log in again.':r.error); e.app=true; throw e; }
      if(r.fresh) S.fresh = r.fresh; return r.data; });
}
/* Loading box with a % bar. Real progress (uploads) moves it forward; while waiting for Google it creeps slowly toward the next step. */
const B = { p:0, floor:0, ceil:92, t:null, depth:0 };
function busyDraw(){ const v=Math.min(100,Math.max(0,B.p)); $('busyBar').style.width=v+'%'; $('busyPct').textContent=Math.floor(v)+'%'; }
function busyStart(msg, sub){
  B.depth++; if(B.depth>1){ busySet(null,null,msg,sub); return; }
  clearTimeout(B.hide); $('busy').className=''; B.p=0; B.floor=0; B.ceil=92;
  $('busyMsg').textContent=msg||'Please wait…'; $('busySub').textContent=sub||''; busyDraw();
  clearInterval(B.t); B.t=setInterval(()=>{ if(B.p<B.ceil){ B.p += Math.max(0.15,(B.ceil-B.p)*0.04); busyDraw(); } },120);
}
function busySet(floor, ceil, msg, sub){
  if(floor!=null){ B.floor=floor; if(B.p<floor) B.p=floor; } if(ceil!=null) B.ceil=Math.max(ceil,B.floor);
  if(msg) $('busyMsg').textContent=msg; if(sub!=null) $('busySub').textContent=sub; busyDraw();
}
function busyEnd(ok){
  B.depth=Math.max(0,B.depth-1); if(B.depth) return;
  clearInterval(B.t);
  if(ok){ B.p=100; busyDraw(); $('busy').className='ok'; $('busyMsg').textContent='Done'; $('busySub').textContent=''; B.hide=setTimeout(()=>$('busy').className='hidden',450); }
  else $('busy').className='hidden';
}
function busy(on,msg){ on ? busyStart(msg) : busyEnd(false); }
function syncing(on){ $('hdSync').classList.toggle('hidden',!on); }
let toastT; function toast(msg,err){ const t=$('toast'); t.textContent=msg; t.className=err?'err':''; clearTimeout(toastT); toastT=setTimeout(()=>t.className='hidden',err?6000:3000); }
async function run(msg, fn){
  busyStart(msg); let ok=false;
  try{ const r = await fn(); ok=true; return r; }
  catch(e){ toast(e.message||String(e),true); if(e&&typeof e==='object') e._shown=true; throw e; }
  finally{ busyEnd(ok); }
}

const ownerKey = () => new URLSearchParams(location.search).get('k');
const cacheName = () => ownerKey() ? 'cm_cache_'+ownerKey() : (S.me ? 'cm_cache_'+S.me.role+'_'+S.me.id : '');
function cacheLoad(name){ try{ return name ? JSON.parse(localStorage.getItem(name)||'null') : null; }catch(e){ return null; } }
function applyData(d){
  S.d=d; S.me=d.me;
  if(!S.adminToken) try{ const n=cacheName(); localStorage.setItem(n, JSON.stringify(d)); if(!ownerKey()) localStorage.setItem('cm_last', n); }catch(e){}
}
function takeFresh(){ const f=S.fresh; S.fresh=null; if(f){ applyData(f); return true; } return false; }

/* ═════════════════ Start / login ═════════════════ */
async function start(){
  const qs = new URLSearchParams(location.search);
  const key = qs.get('k');
  if(key){
    const cached = cacheLoad('cm_cache_'+key);
    let done; S.ready = new Promise(r=>done=r);
    if(cached){ S.d=cached; S.me=cached.me; render(); syncing(true); }
    try{
      const r = await (cached ? api('api_ownerLogin',key) : run('Opening your projects…',()=>api('api_ownerLogin',key)));
      S.token=r.token; S.me=r.me; done();
      if(!takeFresh()) applyData(await api('api_data', S.token));
      render();
    } catch(e){
      done();
      if(!cached) $('app').innerHTML = `<div class="login card"><h1>Access not set up</h1><p class="muted">${h(e.message)}</p></div>`;
      else toast(e.message,true);
    } finally { syncing(false); }
    return;
  }
  const invEmail = qs.get('invite');
  const t = store.get('cm_token');
  if(t){
    S.token=t;
    const cached = cacheLoad(store.get('cm_last'));
    if(cached){ S.d=cached; S.me=cached.me; render(); syncing(true); }
    try{ await reload(); return; }catch(e){} finally{ syncing(false); }
  }
  if(invEmail){ S.tab.login='reg'; S.inviteEmail=invEmail; }
  renderLogin();
}
function setSession(r, keep){
  S.token=r.token; S.me=r.me;
  if(keep!==false && r.me.role!=='owner') store.set('cm_token',r.token);
  S.view={name:'home'};
  if(takeFresh()){ render(); return Promise.resolve(); }
  return reload();
}
function sessionExpired(){ store.set('cm_token',null); S.token=null; setTimeout(()=>{ if(!ownerKey()) renderLogin(); else location.reload(); },50); }
function logout(){ store.set('cm_token',null); store.set('cm_last',null); S.token=S.me=S.d=null; S.adminToken=null; $('asBanner').classList.add('hidden'); if(ownerKey()) location.reload(); else renderLogin(); }
async function reload(){
  const d = await api('api_data', S.token);
  applyData(d); render();
}
async function act(msg, fn){ // run an action; the refreshed data comes back with it
  await run(msg, async()=>{ S.fresh=null; await fn(); if(!takeFresh()) applyData(await api('api_data',S.token)); });
  closeModal(); render();
}

function renderLogin(){
  $('hdWho').textContent=''; $('hdOut').classList.add('hidden');
  const tab = S.tab.login || 'login';
  const trades = ['General Contractor','CCTV','WiFi / Network','Fire Sprinkler','Smoke Detector / Fire Alarm','LPG Line','Aircon','Glass & Aluminum','Signage','Others'];
  $('app').innerHTML = `<div class="login">
    <div class="tabs">
      <button class="tab ${tab==='login'?'on':''}" onclick="S.tab.login='login';renderLogin()">Supplier log in</button>
      <button class="tab ${tab==='reg'?'on':''}" onclick="S.tab.login='reg';renderLogin()">Register as supplier</button>
      <button class="tab ${tab==='admin'?'on':''}" onclick="S.tab.login='admin';renderLogin()">Admin</button>
    </div>
    <div class="card">${
      tab==='login' ? `<h1>Supplier log in</h1>
        <label>Email</label><input type="email" id="lgEmail" autocomplete="username" value="${h(S.inviteEmail||'')}">
        <label>PIN</label><input type="password" id="lgPin" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key==='Enter')supLogin()">
        <div class="row" style="margin-top:14px"><button class="btn" onclick="supLogin()">Log in</button><span class="spacer"></span>
        <a href="#" onclick="forgotPin();return false" class="small">Forgot PIN?</a></div>`
      : tab==='reg' ? `<h1>Register as supplier</h1>${S.inviteEmail?`<div class="infobox">You were invited to submit a quotation. Register with <b>${h(S.inviteEmail)}</b> to see the invitation and the plans. Already registered? Use <b>Supplier log in</b>.</div>`:''}<p class="muted small">You'll receive your PIN by email. SPFC will also review and accredit your company.</p>
        <label>Company name *</label><input type="text" id="rgCompany">
        <div class="f2"><div><label>Contact person *</label><input type="text" id="rgContact"></div>
        <div><label>Mobile *</label><input type="text" id="rgMobile" inputmode="tel"></div></div>
        <div class="f2"><div><label>Email *</label><input type="email" id="rgEmail" value="${h(S.inviteEmail||'')}"></div>
        <div><label>TIN</label><input type="text" id="rgTin"></div></div>
        <label>Business address</label><input type="text" id="rgAddr">
        <label>Trade(s) you can supply *</label>
        ${trades.map(t=>`<label class="chk"><input type="checkbox" name="rgTrade" value="${h(t)}"> ${h(t)}</label>`).join('')}
        <div style="margin-top:14px"><button class="btn" onclick="supRegister()">Register</button></div>`
      : `<h1>Admin log in</h1><label>Admin PIN</label><input type="password" id="adPin" onkeydown="if(event.key==='Enter')adminLogin()">
        <div style="margin-top:14px"><button class="btn" onclick="adminLogin()">Log in</button></div>`
    }</div></div>`;
}
async function supLogin(){ const r = await run('Logging in…',()=>api('api_supplierLogin',$('lgEmail').value,$('lgPin').value)); await setSession(r); }
async function adminLogin(){ const r = await run('Logging in…',()=>api('api_adminLogin',$('adPin').value)); await setSession(r); }
async function forgotPin(){
  const e = ($('lgEmail').value||'').trim(); if(!e) return toast('Type your email first, then click Forgot PIN.',true);

const isOwnerSide = () => S.me.role==='owner' || S.me.role==='admin';

function pkgStats(pk){
  const id = pk.PackageID, today = D().today;
  const cos = where('ChangeOrders',c=>c.PackageID===id);
  const coApproved = cos.filter(c=>c.Status==='Approved').reduce((a,c)=>a+num(c.Amount),0);
  const contract = num(pk.ContractAmount) + coApproved;
  const pays = where('Payments',p=>p.PackageID===id);
  const paid = pays.reduce((a,p)=>a+num(p.Amount),0);
  const ms = where('Milestones',m=>m.PackageID===id).sort((a,b)=>a.Seq-b.Seq);
  const wTot = ms.reduce((a,m)=>a+num(m.Weight),0);
  const msPct = wTot ? ms.filter(m=>truthy(m.Done)).reduce((a,m)=>a+num(m.Weight),0)/wTot*100 : null;
  const ups = where('Updates',u=>u.PackageID===id).sort((a,b)=>String(b.SubmittedAt).localeCompare(String(a.SubmittedAt)));
  const reported = ups[0] ? num(ups[0].Percent) : 0;
  let progress = pk.Status==='Turned Over' ? 100 : (msPct!=null && ms.some(m=>truthy(m.Done)) ? msPct : reported);
  const mob = byId('Mobilization','PackageID',id);
  const active = ['Mobilized','Ongoing'].includes(pk.Status);
  const lastUp = ups[0] ? String(ups[0].SubmittedAt).slice(0,10) : '';
  const sched = active || pk.Status==='Awarded' ? updateRule(pk.UpdateFreq||'Weekly', pk.UpdateDay||'Friday', pk.UpdateDueDate, lastUp, mob?mob.MobDate:'', today) : {active:false};
  const noUpdate = !!sched.overdue;
  const delayed = mob && mob.TargetEnd && today>mob.TargetEnd && !['For Turnover','Turned Over'].includes(pk.Status);
  const pctPaid = contract ? paid/contract*100 : 0;
  return { contract, coApproved, paid, balance: contract-paid, pctPaid, progress, reported, msPct, ms, ups, mob, lastUp, noUpdate, sched, delayed,
    overpaid: contract && pk.AwardedSupplierID && pctPaid > progress + 10 && pk.Status!=='Turned Over',
    openConcerns: where('Concerns',c=>c.PackageID===id && c.Status!=='Resolved').length,
    pendingReq: where('PayRequests',r=>r.PackageID===id && r.Status==='Requested').length,
    pendingCO: cos.filter(c=>c.Status==='Pending').length,
    unconfirmed: pays.filter(p=>p.Status==='Sent').length,
    retention: contract*num(pk.RetentionPct)/100 };
}
/* Required progress updates – same rules as updateRule_() in Code.gs */
const WEEKDAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const addDays = (ymd,n) => { const d=new Date(ymd+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const weekday = ymd => WEEKDAYS[(new Date(ymd+'T00:00:00Z').getUTCDay()+6)%7];
function updateRule(freq, day, dueDate, last, mobDate, today){
  const out = {active:false,next:'',overdue:false};
  if(freq==='None') return out;
  if(freq==='One time'){ if(last||!dueDate) return out; return {active:true,next:dueDate,overdue:today>dueDate}; }
  if(!mobDate || mobDate>today) return out;
  const ref = last || mobDate;
  if(freq==='Daily') return {active:true, next: last&&last>=today?addDays(today,1):today, overdue: daysBetween(ref,today)>=2};
  let d = addDays(ref, freq==='Every 2 weeks'?8:1); while(weekday(d)!==day) d = addDays(d,1);
  return {active:true,next:d,overdue:today>d};
}
function schedText(pk){
  const f = pk.UpdateFreq||'Weekly';
  if(f==='Weekly'||f==='Every 2 weeks') return `${f} – every ${pk.UpdateDay||'Friday'}`;
  if(f==='One time') return `One time only${pk.UpdateDueDate?' – due '+fmtD(pk.UpdateDueDate):''}`;
  if(f==='Daily') return 'Daily';
  return 'No regular updates';
}
function schedFields(pk){
  pk = pk||{}; const f = pk.UpdateFreq||'Weekly';
  return `<div class="f2"><div><label>Required progress updates</label><select id="scFreq" onchange="document.getElementById('scDayW').classList.toggle('hidden',!['Weekly','Every 2 weeks'].includes(this.value));document.getElementById('scDueW').classList.toggle('hidden',this.value!=='One time')">
      ${['Weekly','Every 2 weeks','Daily','One time','None'].map(x=>`<option value="${x}" ${x===f?'selected':''}>${x==='One time'?'One time only':x==='None'?'None (no reminders)':x}</option>`).join('')}</select></div>
    <div><div id="scDayW" class="${['Weekly','Every 2 weeks'].includes(f)?'':'hidden'}"><label>Due every</label><select id="scDay">${WEEKDAYS.map(d=>`<option ${d===(pk.UpdateDay||'Friday')?'selected':''}>${d}</option>`).join('')}</select></div>
    <div id="scDueW" class="${f==='One time'?'':'hidden'}"><label>Due date</label><input type="date" id="scDue" value="${h(pk.UpdateDueDate||'')}"></div></div></div>
    <label>What should the update include? (optional)</label><input type="text" id="scNote" value="${h(pk.UpdateNote||'')}" placeholder="e.g. photos of each area, video walkthrough, materials delivered">
    <p class="small muted">The contractor gets an email reminder when an update is due. You're notified if it's late.</p>`;
}
const readSched = () => ({freq:$('scFreq').value, day:$('scDay').value, dueDate:$('scDue').value, note:$('scNote').value});
function schedForm(pkgId){
  openModal('Required progress updates', schedFields(pkgOf(pkgId)), ()=>{
    const sc = readSched(); if(sc.freq==='One time'&&!sc.dueDate) return toast('Set the due date.',true);
    return act('Saving…',()=>api('api_setUpdateSchedule',S.token,pkgId,sc)); });
}
function projStats(pr){
  const pks = where('Packages',p=>p.ProjectID===pr.ProjectID);
  let contract=0, paid=0, wprog=0, flags=0, concerns=0, reqs=0, awarded=0;
  pks.forEach(p=>{ if(!p.AwardedSupplierID) return; awarded++; const s=pkgStats(p); contract+=s.contract; paid+=s.paid; wprog+=s.progress*s.contract;
    if(s.delayed||s.noUpdate) flags++; concerns+=s.openConcerns; reqs+=s.pendingReq; });
  return { pks, contract, paid, balance:contract-paid, pctPaid: contract?paid/contract*100:0, progress: contract?wprog/contract:0, flags, concerns, reqs, awarded };
}
const STATUS_COLORS = { 'Turned Over':'b-green','Received':'b-green','Accredited':'b-green','Accepted':'b-green','Awarded':'b-green','Approved':'b-green','Resolved':'b-green','Paid':'b-green','Completed':'b-green','Quoted':'b-blue',
  'Ongoing':'b-orange','Mobilized':'b-orange','For Turnover':'b-blue','Final':'b-blue','Submitted':'b-blue','Responded':'b-blue','Viewed':'b-blue',
  'Negotiating':'b-amber','Pending':'b-amber','Requested':'b-amber','Sent':'b-amber','Invited':'b-amber','Quoting':'b-amber','Open':'b-red','Planning':'b-amber',
  'Rejected':'b-red','Declined':'b-red','Not Awarded':'b-red','Expired':'b-red','Suspended':'b-red','Award Cancelled':'b-red' };
const badge = s => `<span class="badge ${STATUS_COLORS[s]||''}">${h(s||'—')}</span>`;
const bar = (p,cls) => `<div class="bar ${cls||''}"><i style="width:${Math.max(0,Math.min(100,num(p)))}%"></i></div>`;
function media(files, link){
  const list = (files||[]).map(f=>{
    if(/^image\//.test(f.mime||'')) return `<a href="${h(f.url)}" target="_blank" rel="noopener" title="${h(f.name)}"><img loading="lazy" src="https://drive.google.com/thumbnail?id=${encodeURIComponent(f.id)}&sz=w300" alt=""></a>`;
    if(/^video\//.test(f.mime||'')) return `<a class="vid" href="${h(f.url)}" target="_blank" rel="noopener" title="${h(f.name)}"></a>`;
    return `<a href="${h(f.url)}" target="_blank" rel="noopener" title="${h(f.name)}"><div class="doc">📄 ${h(f.name)}</div></a>`;
  });
  if(link) list.push(`<a class="vid" href="${h(link)}" target="_blank" rel="noopener" title="Video link"></a>`);
  return list.length ? `<div class="media">${list.join('')}</div>` : '';
}

function go(name, id){ S.view={name,id}; render(); window.scrollTo(0,0); }
function render(){
  if(!S.me) return renderLogin();
  $('hdOut').classList.remove('hidden');
  $('hdWho').innerHTML = `${h(S.me.name)}<br><span style="opacity:.8">${S.me.role==='admin'?'Admin':S.me.role==='owner'?'Owner':'Supplier'}</span>`;
  if(S.me.role==='owner' && new URLSearchParams(location.search).get('k')) $('hdOut').classList.add('hidden');
  const v = S.view, r = S.me.role;
  let html;
  if(v.name==='project') html = projectView(v.id);
  else if(v.name==='package') html = packageView(v.id);
  else if(r==='admin') html = adminHome();
  else if(r==='owner') html = ownerHome();
  else html = supplierHome();
  $('app').innerHTML = html;
}

function supplierHome(){

  if(P.Status!=='Accredited'){
    out += `<div class="card"><div class="row"><h3>Accreditation status</h3>${badge(P.Status)}</div>
      ${P.Status==='Pending'?'<p class="muted">SPFC is reviewing your registration. Upload your documents below to speed it up.</p>':''}
      ${P.Remarks?`<p>Remarks: ${nl(P.Remarks)}</p>`:''}</div>`;
  }
  out += `<div class="card"><div class="row"><h3>Company documents</h3><span class="spacer"></span>
    <button class="btn sm sec" onclick="uploadSupplierDocs()">Upload documents</button><button class="btn sm sec" onclick="editProfile()">Edit profile</button></div>
    <p class="muted small">Business permit, DTI/SEC, BIR 2303, and other permits.</p>${media(docs)||'<p class="muted small">No documents yet.</p>'}</div>`;
  const open = where('Invitations',i=>['Invited','Viewed'].includes(i.Status));
  if(P.Status!=='Accredited' && !open.length && !(D().Quotes||[]).length) return out;
  const groups = {};
  open.forEach(i=>{ (groups[i.ProjectID] = groups[i.ProjectID] || []).push(i); });
  out += `<h2>Invitations to quote</h2>`;
  out += open.length ? Object.keys(groups).map(pid=>{ const pr=proj(pid), list=groups[pid];
    const atts = []; list.forEach(i=>(i.Attachments||[]).forEach(f=>{ if(!atts.some(a=>a.id===f.id)) atts.push(f); }));
    const brief = list.find(i=>i.Brief); const dl = list.map(i=>i.Deadline).sort()[0];
    return `<div class="card"><div class="row"><h3 style="margin:0">${h(pr.Name)}${pr.Branch?' – '+h(pr.Branch):''}</h3><span class="spacer"></span><span class="small muted">Quote due ${fmtD(dl)}</span></div>
      <div class="muted small">${h(pr.Address)}${pr.StartDate?' · construction start '+fmtD(pr.StartDate):''}</div>${siteInfo(pr)}
      ${brief?`<p class="small"><b>Brief:</b> ${nl(brief.Brief)}</p>`:''}
      <h3 style="margin-top:12px">Plans & documents shared with you</h3>${media(atts)||'<p class="small muted">No plans attached.</p>'}
      <h3 style="margin-top:14px">Package(s) to quote</h3>
      <div class="tw"><table>${list.map(i=>{ const pk=pkgOf(i.PackageID), late=i.Deadline<D().today;
        return `<tr><td><span class="pill">${h(pk.Trade)}</span> ${badge(i.Status)}${pk.Scope?`<div class="small" style="margin-top:4px">${nl(pk.Scope)}</div>`:''}</td>
          <td class="small nowrap">Due ${fmtD(i.Deadline)}</td>
          <td class="right">${late?'<span class="small" style="color:var(--red)">Deadline passed</span>':`<button class="btn sm" onclick="quoteForm('${i.InviteID}')">Submit quote</button>`}
          <button class="btn sm sec" onclick="declineInvite('${i.InviteID}')">Decline</button></td></tr>`; }).join('')}</table></div></div>`; }).join('')
    : `<div class="empty">No open invitations right now.</div>`;

  const quoted = where('Invitations',i=>i.Status==='Quoted'||i.Status==='Closed'||(i.Status!=='Declined'&&where('Quotes',q=>q.InviteID===i.InviteID).length));
  out += `<h2>My quotations</h2>`;
  out += quoted.length ? `<div class="tw"><table><tr><th>Project</th><th>Package</th><th>Rev</th><th class="num">Total</th><th>Status</th><th>Owner remarks</th><th></th></tr>
    ${quoted.map(i=>{ const q=latestQuote(i.InviteID); if(!q) return ''; const pk=pkgOf(i.PackageID), pr=proj(i.ProjectID);
      const canRevise = !truthy(q.IsFinal) && ['Submitted','Negotiating'].includes(q.Status) && !pk.AwardedSupplierID;
      return `<tr><td>${h(pr.Branch||pr.Name)}</td><td>${h(pk.Trade)}</td><td>${q.Rev}${truthy(q.IsFinal)?' <span class="badge b-blue">Final</span>':''}</td>
        <td class="num">${peso(q.Total)}${q.VatType?`<div class="small muted">${h(q.VatType)}</div>`:''}</td><td>${badge(q.Status)}</td>
        <td class="small">${q.CounterAmount?`Counter: <b>${peso(q.CounterAmount)}</b><br>`:''}${nl(q.OwnerRemarks)}</td>
        <td class="nowrap"><button class="btn sm sec" onclick="viewQuote('${q.QuoteID}')">View</button>
        ${canRevise?`<button class="btn sm" onclick="quoteForm('${i.InviteID}')">Revise</button>`:''}</td></tr>`; }).join('')}</table></div>` : `<div class="empty">No quotations yet.</div>`;

  const mine = where('Packages',p=>String(p.AwardedSupplierID)===String(S.me.id));
  out += `<h2>My awarded projects</h2>`;
  out += mine.length ? `<div class="grid g2">${mine.map(pk=>{ const s=pkgStats(pk), pr=proj(pk.ProjectID);
    const todo = [];
    if(truthy(pk.DPRequired) && !where('Payments',p=>p.PackageID===pk.PackageID&&p.Type==='Downpayment').length) todo.push('Waiting for downpayment');
    else if(!s.mob && pk.Status==='Awarded') todo.push('Submit mobilization details');
    if(s.unconfirmed) todo.push(s.unconfirmed+' payment(s) to confirm');
    if(s.noUpdate) todo.push('Progress update overdue');
    if(s.openConcerns) todo.push(s.openConcerns+' open concern(s)');
    return `<div class="card click" style="cursor:pointer" onclick="go('package','${pk.PackageID}')"><div class="row"><span class="pill">${h(pk.Trade)}</span>${badge(pk.Status)}</div>
      <h3 style="margin-top:8px">${h(pr.Name)}${pr.Branch?' – '+h(pr.Branch):''}</h3>
      <div class="row small" style="margin:8px 0"><span>Progress ${pct(s.progress)}</span><span class="spacer"></span><span>Paid ${peso(s.paid)} of ${peso(s.contract)}</span></div>${bar(s.progress)}
      ${todo.length?`<div class="warnbox">${todo.map(h).join(' · ')}</div>`:''}</div>`; }).join('')}</div>` : `<div class="empty">No awarded projects yet.</div>`;
  return out;
}

}
const lineRow = l => `<tr><td><input type="text" class="lDesc" value="${h(l.desc)}" oninput="calcLines()"></td><td><input type="number" class="lQty" value="${h(l.qty)}" step="any" oninput="calcLines()"></td>

function readLines(){ return [...document.querySelectorAll('#qLines tr')].slice(1).map(tr=>({desc:tr.querySelector('.lDesc').value.trim(),qty:num(tr.querySelector('.lQty').value),unit:tr.querySelector('.lUnit').value,price:num(tr.querySelector('.lPrice').value)})).filter(l=>l.desc); }
const QUOTE_DOCS = ['Official Receipt / Sales Invoice','Acknowledgment Receipt','Warranty certificate','As-built plans','Test / inspection certificate','Manuals & serial numbers','Delivery receipt','Permits secured','Certificate of completion'];
function vatCalc(sub, type){ const v = type==='VAT Exclusive' ? sub*0.12 : type==='VAT Inclusive' ? sub*0.12/1.12 : 0; return { vat:v, total: type==='VAT Exclusive' ? sub+v : sub }; }
function calcLines(){
  let t=0; document.querySelectorAll('#qLines tr').forEach((tr,i)=>{ if(!i) return; const a=num(tr.querySelector('.lQty').value)*num(tr.querySelector('.lPrice').value); t+=a; tr.querySelector('.lAmt').textContent=peso(a); });
  if(!$('qSum')) return;
  const type = (document.querySelector('input[name=qVat]:checked')||{}).value, c = vatCalc(t,type);
  $('qSum').innerHTML = type==='VAT Exclusive' ? `Subtotal ${peso(t)}<br>+ 12% VAT ${peso(c.vat)}<br><b style="font-size:15px">Total ${peso(c.total)}</b>`
    : type==='VAT Inclusive' ? `<b style="font-size:15px">Total ${peso(t)}</b><br><span class="muted">includes VAT ${peso(c.vat)}</span>`
    : `<b style="font-size:15px">Total ${peso(t)}</b>${type?'<br><span class="muted">Non-VAT</span>':''}`;
}

  const steps = `<div class="steps">${FLOW.map((f,i)=>`<div class="step ${i<cur?'done':''} ${i===cur?'cur':''}">${f}</div>`).join('')}</div>`;
  const back = own ? `<button class="back" onclick="go('project','${pk.ProjectID}')">← ${h(pr.Name)}${pr.Branch?' – '+h(pr.Branch):''}</button>` : `<button class="back" onclick="go('home')">← My projects</button>`;
  let head = `${back}<div class="row"><h1 style="margin:0">${h(pk.Trade)}</h1>${badge(pk.Status)}<span class="spacer"></span>
    ${own&&!awarded?`<button class="btn sec" onclick="packageForm('${pk.ProjectID}','${pk.PackageID}')">Edit scope</button>`:''}</div>
    <p class="muted small">${h(pr.Name)}${pr.Branch?' – '+h(pr.Branch):''}${pr.Address?' · '+h(pr.Address):''}${awarded?' · Contractor: <b>'+h(sup(pk.AwardedSupplierID).Company)+'</b>':''}</p>
    ${pk.Scope?`<p class="small">${nl(pk.Scope)}</p>`:''}${steps}`;
  if(!awarded) return head + (own ? quotingSection(pk) : `<div class="empty">This package is not awarded.</div>`);

  head += `<div class="kpis">
    <div class="kpi"><div class="l">Contract</div><div class="v">${peso(st.contract)}</div>${st.coApproved?`<div class="small muted">incl. ${peso(st.coApproved)} change orders</div>`:''}</div>
    <div class="kpi"><div class="l">Paid</div><div class="v">${peso(st.paid)}</div><div class="small muted">${pct(st.pctPaid)} of contract</div></div>
    <div class="kpi"><div class="l">Balance</div><div class="v">${peso(st.balance)}</div>${st.retention?`<div class="small muted">retention ${peso(st.retention)}</div>`:''}</div>
    <div class="kpi"><div class="l">Progress</div><div class="v">${pct(st.progress)}</div>${bar(st.progress)}<div class="small muted">reported ${pct(st.reported)}</div></div>
    <div class="kpi ${st.delayed?'warn':''}"><div class="l">Target end</div><div class="v" style="font-size:16px">${st.mob?fmtD(st.mob.TargetEnd):'—'}</div>${st.delayed?'<div class="small" style="color:var(--red)">Delayed</div>':''}</div>
  </div>
  ${st.noUpdate?`<div class="warnbox">Progress update overdue – was due ${fmtD(st.sched.next)} (last update: ${st.lastUp?fmtD(st.lastUp):'none'}).</div>`:''}
  ${st.overpaid&&own?`<div class="warnbox">Payments (${pct(st.pctPaid)}) are ahead of progress (${pct(st.progress)}). Check before paying more.</div>`:''}`;
  const tabs = [['overview','Overview'],['updates','Progress updates'],['milestones','Milestones'],['concerns','Concerns',st.openConcerns],['payments','Payments',own?st.pendingReq:st.unconfirmed],
    ['co','Change orders',own?st.pendingCO:0],['turnover','Turnover',own&&pk.Status==='For Turnover'?1:0]];
  const t = S.tab['p'+id] || 'overview';
  head += `<div class="tabs">${tabs.map(([k,l,c])=>`<button class="tab ${t===k?'on':''}" onclick="S.tab['p${id}']='${k}';render()">${l}${c?`<span class="cnt">${c}</span>`:''}</button>`).join('')}</div>`;
  const body = { overview:overviewTab, updates:updatesTab, milestones:milestonesTab, concerns:concernsTab, payments:paymentsTab, co:coTab, turnover:turnoverTab }[t](pk, st, own);
  return head + body;
}

/* — Quoting (owner, before award) — */
function quotingSection(pk){
  const inv = where('Invitations',i=>i.PackageID===pk.PackageID);
  const counts = {invited:inv.length, quoted:0, declined:inv.filter(i=>i.Status==='Declined').length, pending:0};
  const rows = inv.map(i=>{ const s=sup(i.SupplierID), q=latestQuote(i.InviteID); if(q) counts.quoted++; else if(['Invited','Viewed'].includes(i.Status)) counts.pending++;
    const acts = q && !['Declined','Superseded'].includes(q.Status) ? `<button class="btn sm sec" onclick="viewQuote('${q.QuoteID}')">View</button>
       <button class="btn sm sec" onclick="negotiate('${q.QuoteID}')">Negotiate</button>
       ${q.Status!=='Accepted'?`<button class="btn sm sec" onclick="quoteAct('${q.QuoteID}','accept')">Accept</button>`:''}
       <button class="btn sm sec" onclick="quoteAct('${q.QuoteID}','decline')">Decline</button>
       <button class="btn sm green" onclick="awardForm('${q.QuoteID}')">Award</button>`
      : q ? `<button class="btn sm sec" onclick="viewQuote('${q.QuoteID}')">View</button>`
      : ['Invited','Viewed','Expired'].includes(i.Status) ? `<button class="btn sm sec" onclick="extendInvite('${i.InviteID}')">Extend deadline</button>` : '';
    const who = i.SupplierID ? `<b>${h(s.Company)}</b><div class="small muted">${h(s.ContactPerson)} · ${h(s.Mobile)}</div>`
      : `<b>${h(i.SupplierName||i.SupplierEmail)}</b><div class="small muted">${h(i.SupplierEmail)}</div><span class="badge b-amber">Not registered yet</span>`;
    return `<tr><td>${who}</td><td>${badge(i.Status)}${i.DeclineReason?`<div class="small muted">${h(i.DeclineReason)}</div>`:''}</td>
      <td class="small nowrap">${fmtD(i.Deadline)}</td><td class="num">${q?peso(q.Total)+(q.VatType?`<div class="small muted">${h(q.VatType)}</div>`:''):'—'}</td><td class="num">${q?h(q.DurationDays)+' days':'—'}</td>
      <td>${q?`Rev ${q.Rev} ${truthy(q.IsFinal)?'<span class="badge b-blue">Final</span>':''}<br>${badge(q.Status)}`:'—'}</td><td class="nowrap">${acts}</td></tr>`; }).join('');
  const quotes = inv.map(i=>latestQuote(i.InviteID)).filter(q=>q&&!['Declined','Superseded'].includes(q.Status));
  const low = quotes.length ? Math.min(...quotes.map(q=>num(q.Total))) : 0;
  return `<div class="kpis"><div class="kpi"><div class="l">Invited</div><div class="v">${counts.invited}</div></div><div class="kpi"><div class="l">Quoted</div><div class="v">${counts.quoted}</div></div>
      <div class="kpi"><div class="l">Declined</div><div class="v">${counts.declined}</div></div><div class="kpi"><div class="l">Waiting</div><div class="v">${counts.pending}</div></div>
      <div class="kpi"><div class="l">Lowest quote</div><div class="v">${low?peso(low):'—'}</div></div></div>
    <div class="row"><h2 style="margin:0">Invitations & quotations</h2><span class="spacer"></span><button class="btn" onclick="inviteForm('${pk.ProjectID}','${pk.PackageID}')">✉ Invite supplier to quote</button></div>
    <div style="margin-top:10px">${inv.length?`<div class="tw"><table><tr><th>Supplier</th><th>Invitation</th><th>Deadline</th><th class="num">Quote</th><th class="num">Duration</th><th>Quote status</th><th></th></tr>${rows}</table></div>`
      :`<div class="empty">No suppliers invited yet. Click <b>Invite suppliers to quote</b>.</div>`}</div>`;
}
function siteInfo(pr){
  const parts = [];
  if(pr.MapLink) parts.push(`<a href="${h(pr.MapLink)}" target="_blank" rel="noopener">📍 Open in Google Maps</a>`);
  if(pr.SiteContact||pr.SiteMobile) parts.push(`Site contact: <b>${h(pr.SiteContact||'')}</b> ${pr.SiteMobile?`<a href="tel:${h(pr.SiteMobile)}">${h(pr.SiteMobile)}</a>`:''}`);
  return parts.length ? `<p class="small">${parts.join(' · ')}</p>` : '';
}
function plansCard(pr){

    <button class="btn sm sec" onclick="uploadPlans('${pr.ProjectID}')">⬆ Upload plans</button>${plans.length?`<button class="btn sm sec" onclick="managePlans('${pr.ProjectID}')">Remove files</button>`:''}</div>
    ${media(plans)||'<p class="small muted" style="margin:8px 0 0">Upload the floor plan, electrical/plumbing layouts, perspectives, site photos… Invited suppliers see them in their portal and in the invitation email.</p>'}</div>`;

function inviteForm(pid, prePkg){
  const pr = proj(pid);
  const pks = where('Packages',p=>p.ProjectID===pid && !p.AwardedSupplierID);

  openModal(`Invite supplier to quote – ${h(pr.Branch||pr.Name)}`, `

    ${acc.length?`<details style="margin-top:8px"><summary class="small">…or choose from registered suppliers (${acc.length})</summary>
      ${acc.map(s=>`<label class="chk"><input type="checkbox" name="ivSup" value="${s.SupplierID}"> <span><b>${h(s.Company)}</b> <span class="muted small">${h((s.Trades||[]).join(', '))} · ${h(s.Email)}</span></span></label>`).join('')}</details>`:''}
    <label>2. Tick the package(s) they will quote *</label>
    ${pks.map(p=>`<label class="chk"><input type="checkbox" name="ivPkg" value="${p.PackageID}" ${p.PackageID===prePkg?'checked':''}> <span><b>${h(p.Trade)}</b> ${p.Scope?`<span class="muted small">– ${h(p.Scope)}</span>`:''}</span></label>`).join('')}
    <label>3. Tick the plans to share with this supplier</label>
    ${plans.length?`<div class="row small" style="margin-bottom:2px"><a href="#" onclick="document.querySelectorAll('input[name=ivPlan]').forEach(x=>x.checked=true);return false">Select all</a> · <a href="#" onclick="document.querySelectorAll('input[name=ivPlan]').forEach(x=>x.checked=false);return false">None</a></div>
      ${plans.map(f=>`<label class="chk"><input type="checkbox" name="ivPlan" value="${h(f.id)}"> <span>${/^image\//.test(f.mime||'')?'🖼️':'📄'} <a href="${h(f.url)}" target="_blank" rel="noopener">${h(f.name)}</a></span></label>`).join('')}`
      :`<p class="small muted" style="margin:0">No project plans uploaded yet. You can add files here, or close this and use <b>Upload plans</b>.</p>`}
    <label class="small" style="font-weight:400">Additional files for this invitation</label>${fileField('ivFiles','image/*,application/pdf,.dwg,.dxf,.zip',true)}
    <label>4. Brief / instructions</label><textarea id="ivBrief" placeholder="e.g. Please include materials and labor. Quote per item."></textarea>
    <div class="f2"><div><label>Quote deadline *</label><input type="date" id="ivDl" value="${d.toISOString().slice(0,10)}"></div><div><label>Site visit schedule (optional)</label><input type="text" id="ivVisit" placeholder="e.g. Nov 20, 10am"></div></div>
    ${pr.MapLink||pr.SiteContact?`<p class="small">Included in the email: ${pr.MapLink?'📍 map location':''}${pr.MapLink&&pr.SiteContact?' · ':''}${pr.SiteContact?'site contact '+h(pr.SiteContact)+' '+h(pr.SiteMobile||''):''}</p>`:`<div class="infobox">Tip: add the Google Maps link and site contact in the project (Edit) so suppliers get them too.</div>`}
    <p class="small muted">Each supplier gets an email with the packages, plans and a link. New suppliers register with that same email to see the invitation.</p>`,
    async()=>{
      const emails = [...document.querySelectorAll('#ivRows .ivRow')].map(r=>({email:r.querySelector('.ivEmail').value.trim(),name:r.querySelector('.ivName').value.trim()})).filter(e=>e.email);
      const ids = [...document.querySelectorAll('input[name=ivSup]:checked')].map(x=>x.value);
      const pkIds = [...document.querySelectorAll('input[name=ivPkg]:checked')].map(x=>x.value);
      if(!emails.length && !ids.length) return toast('Enter a supplier email.',true);

      const att = await uploadField('ivFiles',{type:'project',projectId:pid,kind:'Invitation files'});
      const brief = $('ivBrief').value + ($('ivVisit').value?`\nSite visit: ${$('ivVisit').value}`:'');
      await act('Sending invitations…',()=>api('api_inviteProject',S.token,pid,{packageIds:pkIds,supplierIds:ids,emails,brief,deadline:$('ivDl').value,attachments:att,planIds:[...document.querySelectorAll('input[name=ivPlan]:checked')].map(x=>x.value)}));
      toast('Invitation sent.'); }, 'Send invitation','',true);
}
function extendInvite(id){ openModal('Extend quote deadline', `<label>New deadline</label><input type="date" id="exDl">`, ()=>act('Saving…',()=>api('api_extendInvite',S.token,id,$('exDl').value))); }
function negotiate(qid){

    ${!truthy(q.IsFinal)&&q.Status!=='Accepted'?'<div class="infobox">This quote is not marked final or accepted yet. You can still award it.</div>':''}
    <div class="f2"><div><label>Contract amount</label><input type="number" id="awAmt" step="any" value="${num(q.Total)}"></div><div><label>Retention % (held until turnover)</label><input type="number" id="awRet" value="0" min="0" max="20"></div></div>
    <p class="small muted">Payment terms quoted: ${h(q.PaymentTerms||'—')}</p>

/* — Overview / mobilization — */
function overviewTab(pk, st, own){
  const m = st.mob, s = sup(pk.AwardedSupplierID), q = byId('Quotes','QuoteID',pk.AwardedQuoteID);
  const dpNeeded = truthy(pk.DPRequired), dpSent = where('Payments',p=>p.PackageID===pk.PackageID&&p.Type==='Downpayment').length;
  let mobBox;
  if(m) mobBox = `<div class="tw"><table>
      <tr><td class="muted">Mobilization date</td><td><b>${fmtD(m.MobDate)}</b></td><td class="muted">Duration</td><td><b>${h(m.DurationDays)} days</b></td></tr>
      <tr><td class="muted">Target completion</td><td><b>${fmtD(m.TargetEnd)}</b></td><td class="muted">Workers</td><td><b>${h(m.Workers)}</b></td></tr>
      <tr><td class="muted">Foreman</td><td colspan="3"><b>${h(m.Foreman)}</b> ${h(m.ForemanMobile)}</td></tr>
      <tr><td class="muted">Materials</td><td colspan="3">${nl(m.Materials)}</td></tr>${m.Notes?`<tr><td class="muted">Notes</td><td colspan="3">${nl(m.Notes)}</td></tr>`:''}</table></div>
      ${!own&&!['For Turnover','Turned Over'].includes(pk.Status)?`<button class="btn sm sec" style="margin-top:8px" onclick="mobForm('${pk.PackageID}')">Edit mobilization</button>`:''}`;
  else if(dpNeeded && !dpSent) mobBox = `<div class="infobox">${own?'Waiting for you to send the downpayment (go to <b>Payments</b> → Record payment). The contractor will then submit the mobilization schedule.':'Waiting for the owner to send the downpayment. You can submit mobilization details after that.'}</div>`;
  else mobBox = own ? `<div class="infobox">Waiting for the contractor to submit the mobilization schedule.</div>` : `<div class="infobox">Please submit your mobilization date, manpower and materials.</div><button class="btn" onclick="mobForm('${pk.PackageID}')">Submit mobilization</button>`;
  const shared = []; if(!own) where('Invitations',i=>i.ProjectID===pk.ProjectID).forEach(i=>(i.Attachments||[]).forEach(f=>{ if(!shared.some(x=>x.id===f.id)) shared.push(f); }));
  const sc = st.sched||{};
  const schedBox = `<div class="card"><div class="row"><h3 style="margin:0">Required progress updates</h3><span class="spacer"></span>${own&&pk.Status!=='Turned Over'?`<button class="btn sm sec" onclick="schedForm('${pk.PackageID}')">Change</button>`:''}</div>
    <p style="margin:8px 0 4px"><b>${h(schedText(pk))}</b></p>${pk.UpdateNote?`<p class="small">Include: ${h(pk.UpdateNote)}</p>`:''}
    ${sc.next?`<p class="small ${sc.overdue?'':'muted'}" style="${sc.overdue?'color:var(--red);font-weight:600':''}">${sc.overdue?'Overdue – was due':'Next update due'} ${fmtD(sc.next)}</p>`
      : (pk.UpdateFreq||'Weekly')!=='None' && !(pk.UpdateFreq==='One time'&&st.lastUp) ? '<p class="small muted">Reminders start on the mobilization date.</p>' : ''}
    ${!own&&sc.active?`<button class="btn sm" onclick="updateForm('${pk.PackageID}')">+ Submit progress update</button>`:''}</div>`;
  return `<div class="grid g2"><div class="card"><h3>Mobilization</h3>${mobBox}</div>${schedBox}
    <div class="card"><h3>Contract</h3><div class="small">
      <p><b>Contractor:</b> ${h(s.Company)} · ${h(s.ContactPerson||'')} ${h(s.Mobile||'')} ${h(s.Email||'')}</p>
      <p><b>Awarded:</b> ${h(pk.AwardedAt)} · <b>Downpayment:</b> ${dpNeeded?'required':'none'} · <b>Retention:</b> ${num(pk.RetentionPct)}%</p>
      ${q?`<p><b>Payment terms:</b> ${h(q.PaymentTerms||'—')} · <b>Warranty:</b> ${h(q.WarrantyMonths||0)} months${q.VatType?' · <b>'+h(q.VatType)+'</b>':''}</p>
      <p><b>Documents to provide:</b> ${h((q.DocsToProvide||[]).join(', ')||'—')}</p>
      ${q.BankName?`<p><b>Pay to:</b> ${h(q.BankName)} · ${h(q.AccountNo)} · ${h(q.AccountName)}</p>`:''}<button class="btn sm sec" onclick="viewQuote('${q.QuoteID}')">View awarded quote</button>`:''}
      ${own&&!where('Payments',p=>p.PackageID===pk.PackageID).length?` <button class="btn sm sec" onclick="cancelAward('${pk.PackageID}')">Cancel award</button>`:''}
      ${pk.TurnedOverAt?`<p class="okbox">Turned over ${h(pk.TurnedOverAt)}${pk.WarrantyEnd?' · warranty until '+fmtD(pk.WarrantyEnd):''}</p>`:''}</div></div></div>
    ${shared.length?`<div class="card"><h3>Plans & documents shared with you</h3>${media(shared)}</div>`:''}
    ${st.ups[0]?`<h2>Latest update</h2>${updateItem(st.ups[0])}`:''}`;
}

function updatesTab(pk, st, own){

  await act('Submitting…',()=>api('api_submitTurnover',S.token,{PackageID:pkgId,Checklist:checks,Docs:(t&&t.Docs||[]).concat(f),Notes:$('toNotes').value}));

/* ═════════════════ Modal ═════════════════ */
function openModal(title, body, onOk, okLabel, okClass, wide){
  const m = $('modal');
  m.innerHTML = `<div class="box ${wide?'wide':''}"><div class="hd">${title}<button class="x" onclick="closeModal()">×</button></div><div class="bd">${body}</div>
    <div class="ft">${onOk?`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn ${okClass||''}" id="mOk">${h(okLabel||'Save')}</button>`:`<button class="btn" onclick="closeModal()">${h(okLabel||'Close')}</button>`}</div></div>`;
  m.classList.remove('hidden');
  if(onOk) $('mOk').onclick = async()=>{ $('mOk').disabled=true; try{ await onOk(); }catch(e){ if(e&&e.message&&!e._shown) toast(e.message,true); } finally{ if($('mOk')) $('mOk').disabled=false; } };
}
function closeModal(){ $('modal').classList.add('hidden'); $('modal').innerHTML=''; }

/* ═════════════════ File uploads ═════════════════ */
function fileField(id, accept, multiple){
  return `<input type="file" id="${id}" accept="${accept}" ${multiple?'multiple':''} onchange="document.getElementById('${id}L').textContent=[...this.files].map(f=>f.name+' ('+(f.size/1048576).toFixed(1)+' MB)').join(', ')"><div class="filelist" id="${id}L"></div>`;
}
const SMALL = 4*1024*1024, CHUNK = 8*1024*1024; // CHUNK must be a multiple of 256 KB
const mb = n => (n/1048576).toFixed(n<10485760?1:0);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
// Retry a request up to 3 times when the connection drops (not when the app itself says no).
async function retry(fn, onRetry){
  for(let i=1;;i++){
    try{ return await fn(); }
    catch(e){ if(e.app || i>=3) throw e; if(onRetry) onRetry(i); await sleep(2000*i); }
  }
}
/* Uploads up to 3 files at the same time. The bar follows the MB actually sent, with time left. */
async function uploadField(id, ctx){
  const files = [...($(id)&&$(id).files||[])];
  if(!files.length) return [];
  const n = files.length;
  busyStart(`Uploading ${n} file${n>1?'s':''}…`, 'Preparing files…'); let ok=false;
  try{
    const prepped = []; for(const f of files) prepped.push(await prepareFile(f));
    const total = prepped.reduce((a,x)=>a+x.blob.size,0) || 1;
    const t0 = Date.now(); let sent = 0, finished = 0, note = '';
    const inflight = new Map(); // index -> bytes still to send for files in progress
    const show = () => {
      const pct = sent/total*100, secs = (Date.now()-t0)/1000, speed = sent/Math.max(1,secs);
      const left = sent>0 && secs>3 ? Math.round((total-sent)/speed) : null;
      const pending = [...inflight.values()].reduce((a,x)=>a+Math.min(x,CHUNK),0); // only the piece being sent now
      busySet(pct, Math.min(99, (sent+pending*0.9)/total*100), `Uploading ${finished} of ${n} file${n>1?'s':''} done`,
        `${mb(sent)} of ${mb(total)} MB sent` + (left!=null ? ` · about ${left>90?Math.ceil(left/60)+' min':left+' sec'} left` : '') + note);
    };
    const tick = setInterval(show, 1000);
    const out = new Array(n); let next = 0;
    const worker = async () => {
      while(next < n){
        const i = next++, {blob,name} = prepped[i];
        inflight.set(i, blob.size); show();
        out[i] = await uploadOne(blob, name, ctx, bytes=>{ sent += bytes; inflight.set(i, Math.max(0, inflight.get(i)-bytes)); note=''; show(); },
                                 k=>{ note = ` · connection slow, retrying (${k})…`; show(); });
        inflight.delete(i); finished++; show();
      }
    };
    try{ await Promise.all([worker(), worker(), worker()]); } finally { clearInterval(tick); }
    ok=true; return out;
  } finally { busyEnd(ok); }
}
const b64 = blob => new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]||''); r.onerror=()=>no(new Error('Could not read the file.')); r.readAsDataURL(blob); });
async function uploadOne(blob, name, ctx, onBytes, onRetry){
  const mime = blob.type || 'application/octet-stream';
  if(blob.size <= SMALL){
    const data = await b64(blob);
    const f = await retry(()=>api('api_uploadSmall',S.token,ctx,name,mime,data), onRetry); onBytes(blob.size); return f;
  }
  const st = await retry(()=>api('api_uploadStart',S.token,ctx,name,mime,blob.size), onRetry);
  for(let pos=0; pos<blob.size; pos+=CHUNK){
    const part = blob.slice(pos,pos+CHUNK), data = await b64(part);
    const r = await retry(()=>api('api_uploadChunk',S.token,st.token,data,pos), onRetry);
    onBytes(part.size);
    if(r.done) return r.file;
  }
  throw new Error('Upload did not finish – please try again.');
}
function prepareFile(file){ // photos resized to max 2048px
  return new Promise(ok=>{
    if(!/^image\/(jpeg|png|webp)$/i.test(file.type)) return ok({blob:file,name:file.name});
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ try{ const max=2048, sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement('canvas');
      c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{ URL.revokeObjectURL(url); ok(b&&b.size<file.size?{blob:b,name:file.name.replace(/\.[^.]+$/,'')+'.jpg'}:{blob:file,name:file.name}); },'image/jpeg',0.85);
    }catch(e){ ok({blob:file,name:file.name}); } };
    img.onerror=()=>ok({blob:file,name:file.name}); img.src=url;
  });
}
